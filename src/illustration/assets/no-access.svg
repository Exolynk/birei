<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="320" height="240" preserveAspectRatio="xMidYMid meet" fill="none" role="img" aria-labelledby="exo-i-no-access-t" class="exo-illustration exo-i-no-access" data-exo-illustration="no-access" data-exo-size="scene">
  <title id="exo-i-no-access-t">No access</title>
  <desc>The companion stands in front of a closed door, much bigger than itself. It tries the handle - the handle dips, a lock badge pops up and shakes 'no', the handle springs back.</desc>
  <style>
@media (prefers-reduced-motion: no-preference) {
  @keyframes exo-i-no-access-k0 {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-1.3px); }
  }
  @keyframes exo-i-no-access-k1 {
    0%,92%,100% { transform: scaleY(1); }
    95% { transform: scaleY(0.08); }
    97% { transform: scaleY(1); }
  }
  @keyframes exo-i-no-access-k2 {
    0%,44% { transform: rotate(0deg); }
    52%,76% { transform: rotate(-16deg); }
    88%,100% { transform: rotate(0deg); }
  }
  @keyframes exo-i-no-access-k3 {
    0%,48% { opacity: 0; transform: scale(0.6); }
    58% { opacity: 1; transform: scale(1.15) translateX(0); }
    63% { opacity: 1; transform: scale(1) translateX(-5px); }
    68% { opacity: 1; transform: scale(1) translateX(5px); }
    73% { opacity: 1; transform: scale(1) translateX(-3px); }
    78%,90% { opacity: 1; transform: scale(1) translateX(0); }
    100% { opacity: 0; transform: scale(0.6); }
  }
  .exo-i-no-access .exo-figure { animation: exo-i-no-access-k0 4.8s cubic-bezier(0.4, 0, 0.2, 1) 0s infinite both; transform-box: fill-box; transform-origin: center; }
  .exo-i-no-access .exo-eyes { animation: exo-i-no-access-k1 6.4s cubic-bezier(0.4, 0, 0.2, 1) 0s infinite both; transform-box: fill-box; transform-origin: center; }
  .exo-i-no-access .exo-handle { animation: exo-i-no-access-k2 5s cubic-bezier(0.4, 0, 0.2, 1) 0s infinite both; transform-box: fill-box; transform-origin: 546px 268.75px; transform-box: view-box; }
  .exo-i-no-access .exo-lock { animation: exo-i-no-access-k3 5s cubic-bezier(0.4, 0, 0.2, 1) 0s infinite both; transform-box: fill-box; transform-origin: center; }
}
</style>
