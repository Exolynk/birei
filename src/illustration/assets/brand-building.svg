  .exo-i-brand-building .exo-built { animation: exo-i-brand-building-k3 3.2s cubic-bezier(0.4, 0, 0.2, 1) 0s infinite both; transform-box: fill-box; transform-origin: center; }
  .exo-i-brand-building .exo-impact-spark-0 { animation: exo-i-brand-building-k4 3.2s cubic-bezier(0.4, 0, 0.2, 1) 0s infinite both; transform-box: fill-box; transform-origin: center; }
