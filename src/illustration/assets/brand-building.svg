    21% { opacity: 1; transform: scale(1.1); }
    27%,57% { opacity: 0; transform: scale(0.3); }
    59% { opacity: 1; transform: scale(1.1); }
    65%,100% { opacity: 0; transform: scale(0.3); }
  }
  @keyframes exo-i-brand-building-k6 {
