<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="320" height="240" preserveAspectRatio="xMidYMid meet" fill="none" role="img" aria-labelledby="exo-i-connection-lost-t" class="exo-illustration exo-i-connection-lost" data-exo-illustration="connection-lost" data-exo-size="scene">
  <title id="exo-i-connection-lost-t">Connection lost</title>
  <desc>A link in the fabric has snapped mid-span. The companion holds one broken end, the other trails off to a kite that's come loose and drifts in the wind.</desc>
  <style>
@media (prefers-reduced-motion: no-preference) {
  @keyframes exo-i-connection-lost-k0 {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-1.5px); }
  }
  @keyframes exo-i-connection-lost-k1 {
    0%,18% { transform: translate(0,0); }
    30%,48% { transform: translate(5px, -3px); }
    60%,100% { transform: translate(0,0); }
  }
  @keyframes exo-i-connection-lost-k2 {
    0%,100% { transform: rotate(-10deg); }
    50% { transform: rotate(10deg); }
  }
  @keyframes exo-i-connection-lost-k3 {
    0%,100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }
  @keyframes exo-i-connection-lost-k4 {
    0%,100% { transform: rotate(-7deg); }
    50% { transform: rotate(7deg); }
  }
  .exo-i-connection-lost .exo-figure { animation: exo-i-connection-lost-k0 4.4s cubic-bezier(0.4, 0, 0.2, 1) 0s infinite both; transform-box: fill-box; transform-origin: center; }
  .exo-i-connection-lost .exo-eyes { animation: exo-i-connection-lost-k1 4.4s cubic-bezier(0.4, 0, 0.2, 1) 0s infinite both; transform-box: fill-box; transform-origin: center; }
  .exo-i-connection-lost .exo-curl-b { animation: exo-i-connection-lost-k2 3.4s cubic-bezier(0.4, 0, 0.2, 1) 0s infinite both; transform-box: fill-box; transform-origin: 50% 100%; }
  .exo-i-connection-lost .exo-curl-a { animation: exo-i-connection-lost-k3 3.4s cubic-bezier(0.4, 0, 0.2, 1) 0.5s infinite both; transform-box: fill-box; transform-origin: 50% 100%; }
  .exo-i-connection-lost .exo-kite { animation: exo-i-connection-lost-k4 3.8s cubic-bezier(0.4, 0, 0.2, 1) 0s infinite both; transform-box: fill-box; transform-origin: 32% 8%; }
}
</style>
